services:
  postgres:
    image: postgres:17
    container_name: heimdall-postgres
    environment:
      POSTGRES_DB: heimdall
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - heimdall-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  heimdall-pgdata:
