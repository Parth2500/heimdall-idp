<!doctype html>
<!-- Heimdall design mockup. Not production code. Exported from the design canvas; see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card — Choose an account (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.hd-page{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:48px 24px}
.hd-card{width:100%;max-width:448px;box-sizing:border-box;padding:36px 40px 32px;border:1px solid;border-radius:10px;display:flex;flex-direction:column;gap:24px}
.hd-foot{width:100%;max-width:448px;box-sizing:border-box;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px}
.hd-row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 8px;font:inherit;text-align:left;background:none;border:0;border-radius:6px;cursor:pointer;color:inherit}
@media (max-width:520px){.hd-page{justify-content:flex-start;padding:0 0 24px;background-image:none !important}.hd-card{border:0 !important;border-radius:0;padding:20px;background:transparent !important}.hd-foot{padding:0 20px}}
input:focus,button:focus,a:focus{outline:3px solid #f2b705;outline-offset:2px}
</style>
</head>
<body>
<div class="hd-page" style="background-color: #0c0e11; background-image: radial-gradient(ellipse 34% 48% at 50% 50%, #0c0e11 55%, rgba(12,14,17,0) 100%), linear-gradient(#1d2128 1px, transparent 1px), linear-gradient(90deg, #1d2128 1px, transparent 1px), linear-gradient(#14171b 1px, transparent 1px), linear-gradient(90deg, #14171b 1px, transparent 1px); background-size: 100% 100%, 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: center, center, center, center, center; color: #eceae4; font-family: 'IBM Plex Sans', system-ui, sans-serif">
  <main class="hd-card" style="background: #16191e; border-color: #2c3038">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.01em">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceae4" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      Heimdall
    </div>

    <div style="border-top: 2px solid #eceae4; padding-top: 12px; display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a8b2">You are on</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; word-break: break-all">acme.localhost:7299</div>
      <div style="font-size: 14px; line-height: 1.45; color: #c4c7ce">Check that your address bar shows the same host.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Choose an account</h1>
      <p style="margin: 0; font-size: 16px; color: #c4c7ce">to continue to Huginn</p>
    </div>

    <form style="margin: 0 -8px">
      <ul style="list-style: none; margin: 0; padding: 0">
        
          <li style="border-bottom: 1px solid #2c3038">
            <button type="submit" name="account" value="parth@acme.test" class="hd-row">
              <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #8aa6ff; color: #0b0e14; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">PM</span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 600">Parth Makwana</span>
                <span style="font-size: 14px; color: #a3a8b2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">parth@acme.test</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 13px; color: #a3a8b2">
                <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8aa6ff; background: #8aa6ff"></span>
                Signed in
              </span>
            </button>
          </li>
        
          <li style="border-bottom: 1px solid #2c3038">
            <button type="submit" name="account" value="qa@acme.test" class="hd-row">
              <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #8aa6ff; color: #0b0e14; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">QA</span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 600">QA tester</span>
                <span style="font-size: 14px; color: #a3a8b2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">qa@acme.test</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 13px; color: #a3a8b2">
                <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #8aa6ff; background: #8aa6ff"></span>
                Signed in
              </span>
            </button>
          </li>
        
          <li style="border-bottom: 1px solid #2c3038">
            <button type="submit" name="account" value="admin@acme.test" class="hd-row">
              <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #1f2329; color: #eceae4; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">AD</span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 16px; font-weight: 600">Acme admin</span>
                <span style="font-size: 14px; color: #a3a8b2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">admin@acme.test</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 13px; color: #a3a8b2">
                <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid #7d838f; background: transparent"></span>
                Signed out
              </span>
            </button>
          </li>
        
        <li>
          <a href="Card-Email-Dark.html" class="hd-row" style="text-decoration: none">
            <span aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: 1.5px dashed #7d838f; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#eceae4" stroke-width="2"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            </span>
            <span style="font-size: 16px; font-weight: 600; color: #9db4ff">Use another account</span>
          </a>
        </li>
      </ul>
    </form>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid #2c3038; font-size: 14px; color: #a3a8b2">
      <span>Returns you to <span style="font-family: 'IBM Plex Mono', monospace; color: #eceae4">huginn.localhost:4200</span></span>
      <button type="button" style="font: inherit; font-size: 14px; font-weight: 600; color: #9db4ff; background: none; border: 0; padding: 0; cursor: pointer">Sign out of all</button>
    </div>
  </main>
  <footer class="hd-foot" style="color: #a3a8b2">
    <span>Development build. Not for production use.</span>
    <span>Heimdall identity provider</span>
  </footer>
</div>
</body>
</html>
