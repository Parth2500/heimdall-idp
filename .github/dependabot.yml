version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # The OpenTelemetry packages release together and must stay at one version.
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every step of github/codeql-action must run the same version, or the analyze step fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  # The base images in the Dockerfile are pinned by digest. Dependabot moves the tag and the digest together.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The UI build stage uses the Node major in ui/.nvmrc, which Angular supports. A new major moves with Angular,
      # not on its own. Patch and minor updates still come.
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      # Angular packages must move together, at one version.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
    ignore:
      # Each Angular release supports one TypeScript minor line (a peer dependency of @angular/build).
      # TypeScript moves when Angular moves, not on its own.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
