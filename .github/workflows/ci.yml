name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heimdall.slnx

      - name: Build
        run: dotnet build Heimdall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Heimdall.slnx --configuration Release --no-build --verbosity normal
