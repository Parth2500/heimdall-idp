name: CI

# Runs only when .NET code or its build files change. The UI has its own workflow (ui.yml), and a docs-only change
# runs neither. No status check is required on main, so a skipped workflow blocks nothing.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Heimdall.slnx"
      - "global.json"
      - "Directory.Build.props"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Heimdall.slnx"
      - "global.json"
      - "Directory.Build.props"
      - "dotnet-tools.json"
      - ".editorconfig"
      - ".github/workflows/ci.yml"

# A new push to a pull request (also a Dependabot rebase) cancels its older run. A run on main is never cancelled,
# because it tests the merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved or hijacked tag cannot change the code that runs.
# Dependabot updates the pins.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The package cache, keyed on every file that names a package version. A change to any of them misses the
      # cache, so a restore never uses an old package.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json', 'dotnet-tools.json') }}

      # NuGet audit (Directory.Build.props) fails the restore on a known-vulnerable package.
      - name: Restore
        run: dotnet restore Heimdall.slnx

      - name: List vulnerable packages
        run: |
          dotnet list Heimdall.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Build
        run: dotnet build Heimdall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Heimdall.slnx --configuration Release --no-build --verbosity normal
