name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved or hijacked tag cannot change the code that runs.
# Dependabot updates the pins.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet audit (Directory.Build.props) fails the restore on a known-vulnerable package.
      - name: Restore
        run: dotnet restore Heimdall.slnx

      - name: List vulnerable packages
        run: |
          dotnet list Heimdall.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Build
        run: dotnet build Heimdall.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Heimdall.slnx --configuration Release --no-build --verbosity normal

  # The Angular workspace in ui/ (frontend-design.md, U8).
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc

      # Install scripts are the most common way a malicious package runs code. None run here.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Audit
        run: npm audit --audit-level=low

      - name: Check formatting
        run: npm run lint:format

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
