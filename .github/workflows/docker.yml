name: Docker

# Builds the production image when the Dockerfile changes. Dependabot moves its base images, and before this
# workflow nothing built the image on such a change. The image is not pushed anywhere.
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the server image
        run: docker build --pull --tag heimdall:ci .

      # The migration bundle, which each release runs once (see the Dockerfile).
      - name: Build the migration image
        run: docker build --tag heimdall-migrate:ci --target migrate .
