name: CodeQL

# The C# analysis runs when C# code or its build changes. The weekly run scans everything, so a new query in a
# CodeQL release also reaches code that did not change.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Heimdall.slnx"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Heimdall.slnx"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build Heimdall.slnx --configuration Release

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp
