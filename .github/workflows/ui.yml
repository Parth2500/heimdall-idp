name: UI

# The Angular workspace in ui/. It runs only when ui/ changes. The .NET build is in ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved or hijacked tag cannot change the code that runs.
jobs:
  # The Angular workspace in ui/ (frontend-design.md, U8).
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version that the packageManager field in ui/package.json names.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      # The pnpm store cache, keyed on the lock file. A frozen install still installs exactly what the lock file names.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Install scripts are the most common way a malicious package runs code. None run here.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit
        run: pnpm audit --audit-level low

      - name: Check formatting
        run: pnpm run lint:format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
